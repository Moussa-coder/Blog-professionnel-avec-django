{% extends "blog/base.html" %}
{% block content %}
<h2>Articles récents</h2>
<div class="row">
  {% for article in articles %}
    <div class="col-md-4 mb-3">
      <div class="card h-100">
        {% if article.image %}
        <img src="{{ article.image.url }}" class="card-img-top" alt="{{ article.titre }}">
        {% endif %}
        <div class="card-body">
          <h5 class="card-title">{{ article.titre }}</h5>
          <p class="card-text">{{ article.contenu|truncatewords:20 }}</p>
          <a href="{% url 'article_detail' article.slug %}" class="btn btn-primary">Lire</a>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
