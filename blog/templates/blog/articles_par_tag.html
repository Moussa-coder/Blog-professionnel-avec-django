{% extends 'blog/base.html' %}
{% block content %}
  <h2>Articles avec le tag "{{ tag.nom }}"</h2>
  <div class="row">
    {% for article in articles %}
      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-body">
            <h5>{{ article.titre }}</h5>
            <p>{{ article.contenu|truncatewords:20 }}</p>
            <a href="{% url 'article_detail' article.slug %}">Lire l'article</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
